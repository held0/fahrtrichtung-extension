name: Release & Publish to Stores

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $TAG"

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' chrome/manifest.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Tag: v$TAG_VERSION, manifest.json: $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run headless tests
        run: npm run test:headless

      - name: Build browser ZIPs
        run: |
          chmod +x sync-browsers.sh
          ./sync-browsers.sh

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx chrome-webstore-upload-cli upload \
            --source fahrtrichtung-chrome.zip \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"

      - name: Upload to Firefox AMO
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir firefox/ \
            --channel listed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

      - name: Upload to Edge Add-ons
        continue-on-error: true
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_CLIENT_SECRET: ${{ secrets.EDGE_CLIENT_SECRET }}
          EDGE_ACCESS_TOKEN_URL: ${{ secrets.EDGE_ACCESS_TOKEN_URL }}
        run: |
          # Get access token
          TOKEN_RESPONSE=$(curl -s -X POST "$EDGE_ACCESS_TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$EDGE_CLIENT_ID" \
            -d "scope=https://api.addons.microsoftedge.microsoft.com/.default" \
            -d "client_secret=$EDGE_CLIENT_SECRET" \
            -d "grant_type=client_credentials")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to get Edge access token"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          # Upload package
          UPLOAD_RESPONSE=$(curl -s -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions/draft/package" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @fahrtrichtung-edge.zip)
          echo "Upload response: $UPLOAD_RESPONSE"
          OPERATION_ID=$(echo "$UPLOAD_RESPONSE" | jq -r '.operationId // empty')
          if [ -z "$OPERATION_ID" ]; then
            echo "::warning::Edge upload may have failed — check Partner Center"
          fi

          # Publish (submit for review)
          curl -s -X POST \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "::warning::Edge publish request failed — check Partner Center"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fahrtrichtung-chrome.zip
            fahrtrichtung-firefox.zip
            fahrtrichtung-edge.zip
            fahrtrichtung-opera.zip
