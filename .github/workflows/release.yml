name: Release & Publish to Stores

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $TAG"

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' chrome/manifest.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Tag: v$TAG_VERSION, manifest.json: $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version match confirmed: $TAG_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run headless tests
        run: npm run test:headless

      - name: Build browser ZIPs
        run: |
          chmod +x sync-browsers.sh
          ./sync-browsers.sh

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx chrome-webstore-upload-cli upload \
            --source fahrtrichtung-chrome.zip \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --auto-publish

      - name: Upload to Firefox AMO
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.FIREFOX_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --source-dir firefox/ \
            --channel listed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

      - name: Upload to Edge Add-ons
        continue-on-error: true
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Edge Add-ons API v1.1: ApiKey-Auth. Operation-ID kommt aus dem Location-Header,
          # NICHT aus dem (leeren) Response-Body. Mit Status-Polling für Upload + Publish.
          BASE="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID/submissions"
          loc() { tr -d '\r' | awk -F': ' '/^[Ll]ocation:/{print $2}'; }

          echo "== Upload package =="
          OP=$(curl -sS -X POST "$BASE/draft/package" \
            -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/zip" \
            --data-binary @fahrtrichtung-edge.zip \
            -D - -o /dev/null | loc)
          echo "Upload operation: ${OP:-<empty>}"
          if [ -z "${OP:-}" ]; then echo "::error::Edge upload failed (no operation header — API key/client ID expired?)"; exit 1; fi

          echo "== Poll upload status =="
          for i in $(seq 1 30); do
            R=$(curl -sS "$BASE/draft/package/operations/$OP" \
              -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
            S=$(echo "$R" | jq -r '.status // "Unknown"')
            echo "  status: $S"
            [ "$S" = "Succeeded" ] && break
            if [ "$S" = "Failed" ]; then echo "::error::Edge upload processing failed: $R"; exit 1; fi
            sleep 10
          done

          echo "== Submit for publication =="
          POP=$(curl -sS -X POST "$BASE" \
            -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/json" \
            -d '{"notes":"Automated submission"}' \
            -D - -o /dev/null | loc)
          echo "Publish operation: ${POP:-<empty>}"
          if [ -z "${POP:-}" ]; then echo "::error::Edge submission failed (no operation header)"; exit 1; fi

          echo "== Poll publish status =="
          for i in $(seq 1 30); do
            R=$(curl -sS "$BASE/operations/$POP" \
              -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")
            S=$(echo "$R" | jq -r '.status // "Unknown"')
            echo "  status: $S"
            if [ "$S" = "Succeeded" ]; then echo "✅ Edge submission succeeded"; exit 0; fi
            if [ "$S" = "Failed" ]; then echo "::error::Edge publish failed: $R"; exit 1; fi
            sleep 10
          done
          echo "::warning::Edge publish still in progress after polling — check Partner Center"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fahrtrichtung-chrome.zip
            fahrtrichtung-firefox.zip
            fahrtrichtung-edge.zip
            fahrtrichtung-opera.zip
