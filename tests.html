<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Fahrtrichtung Tests</title>
  <style>
    body { font-family: monospace; font-size: 14px; margin: 20px; }
    .pass { color: #080; }
    .fail { color: #c00; font-weight: bold; }
    .group { margin: 16px 0 4px; font-weight: bold; font-size: 15px; }
    .summary { margin-top: 20px; padding: 10px; border: 2px solid; font-size: 16px; }
    .summary.all-pass { border-color: #080; color: #080; }
    .summary.has-fail { border-color: #c00; color: #c00; }
  </style>
</head>
<body>
<h1>Fahrtrichtung Unit Tests</h1>
<div id="results"></div>

<script src="chrome/utils.js"></script>
<script>
// ---- Test framework ----
let passed = 0, failed = 0;
const results = document.getElementById('results');

function group(name) {
  const el = document.createElement('div');
  el.className = 'group';
  el.textContent = name;
  results.appendChild(el);
}

function assert(description, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  const el = document.createElement('div');
  if (ok) {
    el.className = 'pass';
    el.textContent = `  PASS: ${description}`;
    passed++;
  } else {
    el.className = 'fail';
    el.textContent = `  FAIL: ${description} — got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`;
    failed++;
  }
  results.appendChild(el);
}

// ---- Copy functions from background.js that can't be importScripts'd in browser ----

function stripHtml(html) {
  return html.replace(/<[^>]+>/g, '');
}

function decodeEntities(text) {
  return text
    .replace(/&nbsp;/g, ' ')
    .replace(/&ndash;/g, '\u2013')
    .replace(/&mdash;/g, '\u2014')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n)));
}

function parseValidity(html) {
  const text = decodeEntities(stripHtml(html)).replace(/\s+/g, ' ').replace(/\s*ansehen\s*$/, '').trim();
  const timePattern = /<time\s+datetime="([^"]+)">/g;
  const times = [];
  let tm;
  while ((tm = timePattern.exec(html)) !== null) {
    times.push(tm[1]);
  }
  let from = times[0] || null;
  let to = times[1] || null;
  if (times.length === 1) {
    if (text.includes(' bis ')) {
      to = times[0];
      from = null;
    } else {
      to = null;
    }
  }
  const dayMap = { 'mo': 1, 'di': 2, 'mi': 3, 'do': 4, 'fr': 5, 'sa': 6, 'so': 0 };
  let days = null;
  if (text && !text.includes('tgl')) {
    const dayPart = text.match(/gültig\s+(.+?)(?:\s+\d|\s+ab\s|\s+bis\s)/i);
    if (dayPart) {
      const dayStr = dayPart[1].trim();
      const rangeMatch = dayStr.match(/^(Mo|Di|Mi|Do|Fr|Sa|So)-(Mo|Di|Mi|Do|Fr|Sa|So)$/i);
      if (rangeMatch) {
        const startDay = dayMap[rangeMatch[1].toLowerCase()];
        const endDay = dayMap[rangeMatch[2].toLowerCase()];
        days = [];
        for (let d = startDay; ; d = (d + 1) % 7) {
          days.push(d);
          if (d === endDay) break;
        }
      } else {
        const abbrs = dayStr.match(/\b(Mo|Di|Mi|Do|Fr|Sa|So)\b/gi);
        if (abbrs?.length) {
          days = abbrs.map(a => dayMap[a.toLowerCase()]);
        }
      }
    }
  }
  return { text, from, to, days };
}

function findValidEntry(entries, dateStr) {
  const date = new Date(dateStr);
  const dayOfWeek = date.getUTCDay();
  for (const entry of entries) {
    const { from, to, days } = entry.validity;
    if (days && !days.includes(dayOfWeek)) continue;
    if (from && to) {
      if (date >= new Date(from) && date <= new Date(to)) return entry;
    } else if (from && !to) {
      if (date >= new Date(from)) return entry;
    } else if (!from && to) {
      if (date <= new Date(to)) return entry;
    } else {
      return entry;
    }
  }
  return null;
}

function parseRichtungswechsel(html) {
  const segments = [];
  const parts = html.split(/<br\s*\/?>/i).filter(p => p.trim());
  for (const part of parts) {
    const hasLeftArrow = part.includes('pfeillinks');
    const hasRightArrow = part.includes('pfeilrechts');
    const textContent = decodeEntities(stripHtml(part)).trim();
    if (!textContent) continue;
    const routeMatch = textContent.match(/(.+?)\s+[\u2013\u2014-]\s+(.+)/);
    const from = routeMatch ? routeMatch[1].trim() : textContent;
    const to = routeMatch ? routeMatch[2].trim() : '';
    segments.push({ from, to, direction: hasLeftArrow ? 'left' : (hasRightArrow ? 'right' : 'unknown'), text: textContent, firstWagonIsFront: hasLeftArrow });
  }
  return segments;
}

// bahn.de "reiseloesung" parsing (copied from chrome/background.js)
function parseBahnDeBoard(entries) {
  if (!Array.isArray(entries)) return [];
  const out = [];
  for (const e of entries) {
    const name = (e?.verkehrmittel?.name || e?.verkehrmittel?.mittelText || '').replace(/\s+/g, ' ').trim();
    if (!name || !e.journeyId) continue;
    out.push({ name, zeit: e.zeit || '', journeyId: e.journeyId });
  }
  return out;
}

function parseBahnDeHalte(halte) {
  if (!Array.isArray(halte)) return [];
  return halte
    .filter(h => h?.name)
    .map(h => {
      const stop = {
        name: h.name.replace(/\s+/g, ' ').trim(),
        dep: h.abfahrt?.sollzeit || null,
        arr: h.ankunft?.sollzeit || null,
      };
      const xy = typeof h.id === 'string' ? h.id.match(/@X=(-?\d+)@Y=(-?\d+)/) : null;
      if (xy) { stop.lon = Number(xy[1]) / 1e6; stop.lat = Number(xy[2]) / 1e6; }
      return stop;
    });
}

function shiftTime(hhmm, deltaMin) {
  const [h, m] = hhmm.split(':').map(Number);
  let total = h * 60 + m + deltaMin;
  if (total < 0) total = 0;
  if (total > 23 * 60 + 59) total = 23 * 60 + 59;
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}:00`;
}

// Kern von findJourneyByHint(): Eintrag mit exaktem Namen UND Minute bevorzugen,
// sonst erster Namenstreffer (synchroner Teil, damit er hier testbar ist)
const LONG_DISTANCE_TYPES = new Set(['ICE', 'IC', 'EC', 'ECE', 'RJ', 'RJX', 'NJ', 'EN', 'TGV', 'EST', 'IR', 'D']);
function boardEntryMatches(entryName, trainName) {
  if (entryName === trainName) return true;
  const a = entryName.match(/^([A-Z]+)\s+(\d+)$/);
  const b = trainName.match(/^([A-Z]+)\s+(\d+)$/);
  if (!a || !b || a[2] !== b[2]) return false;
  return LONG_DISTANCE_TYPES.has(a[1]) && LONG_DISTANCE_TYPES.has(b[1]);
}
function pickBoardEntry(entries, trainName, wantedMinute) {
  const pick = entries.find(e => e.name === trainName && e.zeit.slice(0, 16) === wantedMinute)
    || entries.find(e => e.name === trainName)
    || entries.find(e => boardEntryMatches(e.name, trainName) && e.zeit.slice(0, 16) === wantedMinute)
    || entries.find(e => boardEntryMatches(e.name, trainName));
  return pick ? pick.journeyId : null;
}

function stationNames(stationOrder) {
  return stationOrder.map(s => typeof s === 'string' ? s : s.name);
}

function findSegBoundary(stationName, normNames) {
  const norm = normalizeStation(stationName);
  const idx = findInStationList(norm, normNames);
  if (idx >= 0) return idx;
  for (let i = 0; i < normNames.length; i++) {
    if (stationMatchLoose(norm, normNames[i])) return i;
  }
  return -1;
}

function findSegmentForStation(segments, station, stationOrder) {
  if (!station || !segments.length) return -1;
  const names = stationNames(stationOrder).map(normalizeStation);
  const stationIdx = findInStationList(normalizeStation(station), names);
  if (stationIdx < 0) return -1;
  let coverLo = -1, coverLoSeg = -1;
  let coverHi = -1, coverHiSeg = -1;
  for (let i = 0; i < segments.length; i++) {
    const seg = segments[i];
    let segFromIdx = findSegBoundary(seg.from, names);
    let segToIdx = findSegBoundary(seg.to, names);
    if (segFromIdx < 0 && segToIdx >= 0) segFromIdx = 0;
    if (segToIdx < 0 && segFromIdx >= 0) segToIdx = names.length - 1;
    if (segFromIdx >= 0 && segToIdx >= 0) {
      const lo = Math.min(segFromIdx, segToIdx);
      const hi = Math.max(segFromIdx, segToIdx);
      if (stationIdx >= lo && stationIdx <= hi) return i;
      if (coverLo < 0 || lo < coverLo) { coverLo = lo; coverLoSeg = i; }
      if (coverHi < 0 || hi > coverHi) { coverHi = hi; coverHiSeg = i; }
    }
  }
  if (coverLo >= 0 && stationIdx < coverLo) return coverLoSeg;
  if (coverHi >= 0 && stationIdx > coverHi) return coverHiSeg;
  return -1;
}

function stationOrderMatchesEntry(stationOrder, validEntry) {
  if (!stationOrder.length) return false;
  const names = stationNames(stationOrder).map(normalizeStation);
  const anchors = [];
  if (validEntry.route) {
    for (const part of validEntry.route.split(/\s+[–—-]+\s+/)) {
      const p = part.trim();
      if (p) anchors.push(p);
    }
  }
  for (const seg of validEntry.segments) {
    if (seg.from) anchors.push(seg.from);
    if (seg.to) anchors.push(seg.to);
  }
  if (!anchors.length) return true;
  return anchors.some(a => findSegBoundary(a, names) >= 0);
}

// From popup.js
function getDisplayDirection(seg, wagonNumbers) {
  if (!wagonNumbers?.length || wagonNumbers.length < 2) return seg.direction;
  const frontWagon = seg.firstWagonIsFront ? wagonNumbers[0] : wagonNumbers[wagonNumbers.length - 1];
  const nums = wagonNumbers.map(Number).filter(n => !isNaN(n));
  if (!nums.length) return seg.direction;
  const frontNum = Number(frontWagon);
  return (frontNum > (Math.min(...nums) + Math.max(...nums)) / 2) ? 'right' : 'left';
}

function filterRelevantSegments(segments, fromSegIdx, toSegIdx) {
  if (fromSegIdx >= 0 && toSegIdx >= 0) {
    const lo = Math.min(fromSegIdx, toSegIdx);
    const hi = Math.max(fromSegIdx, toSegIdx);
    return { segments: segments.slice(lo, hi + 1), startIdx: lo };
  }
  return { segments, startIdx: 0 };
}

function formatDuration(duration) {
  if (!duration) return '';
  if (duration.hours > 0) {
    return `${duration.hours}h${String(duration.minutes).padStart(2, '0')}min`;
  }
  return `${duration.minutes}min`;
}

// computeSegmentDuration is now in utils.js (loaded via script tag)

// ============= TESTS =============

// --- normalizeStation ---
group('normalizeStation()');
assert('basic with Hbf', normalizeStation('K\u00f6ln Hbf'), 'k\u00f6lnhauptbahnhof');
assert('with hyphen', normalizeStation('Hamburg-Harburg'), 'hamburgharburg');
assert('empty string', normalizeStation(''), '');
assert('null', normalizeStation(null), '');
assert('spaces', normalizeStation('  Spaces  '), 'spaces');
assert('umlauts preserved', normalizeStation('M\u00fcnchen Hbf'), 'm\u00fcnchenhauptbahnhof');
assert('(M) to (Main)', normalizeStation('Frankfurt(M)Hbf'), 'frankfurtmainhauptbahnhof');
assert('Fernbf expansion', normalizeStation('Berlin Fernbf'), 'berlinfernbahnhof');

// --- findInStationList ---
group('findInStationList()');
const testList = ['karlsruhehauptbahnhof', 'k\u00f6lnhauptbahnhof', 'hamburghauptbahnhof'];
assert('exact match', findInStationList('hamburghauptbahnhof', testList), 2);
assert('no match', findInStationList('berlinhauptbahnhof', testList), -1);
assert('empty needle', findInStationList('', testList), -1);

const ambiguousList = ['hamburgharburg', 'hamburghauptbahnhof'];
// 'hamburgharburg' (14 chars) is closer to 'hamburg' (7 chars) than 'hamburghauptbahnhof' (19 chars)
// In practice, the needle is always a normalized full station name, so exact match catches it.
assert('closest length: hamburg -> hamburgharburg (closer len diff)', findInStationList('hamburg', ambiguousList), 0);
assert('exact normalized name matches correctly', findInStationList('hamburghauptbahnhof', ambiguousList), 1);

assert('substring match', findInStationList('frankfurtmain', ['frankfurtmainhauptbahnhof']), 0);

// --- stationMatch ---
group('stationMatch()');
assert('exact', stationMatch('k\u00f6lnhauptbahnhof', 'k\u00f6lnhauptbahnhof'), true);
assert('substring', stationMatch('k\u00f6ln', 'k\u00f6lnhauptbahnhof'), true);
assert('no match', stationMatch('k\u00f6lnhauptbahnhof', 'berlinhauptbahnhof'), false);
assert('empty a', stationMatch('', 'k\u00f6lnhauptbahnhof'), false);
assert('empty b', stationMatch('k\u00f6lnhauptbahnhof', ''), false);
assert('Hamburg Hbf vs Hamburg-Altona: NOT same station', stationMatch('hamburghauptbahnhof', 'hamburgaltona'), false);

// --- stationMatchLoose ---
group('stationMatchLoose()');
assert('exact', stationMatchLoose('k\u00f6lnhauptbahnhof', 'k\u00f6lnhauptbahnhof'), true);
assert('substring', stationMatchLoose('k\u00f6ln', 'k\u00f6lnhauptbahnhof'), true);
assert('Hamburg Hbf vs Altona: loose match', stationMatchLoose('hamburghauptbahnhof', 'hamburgaltona'), true);
assert('no match across cities', stationMatchLoose('k\u00f6lnhauptbahnhof', 'berlinhauptbahnhof'), false);

// --- cleanStationName ---
group('cleanStationName()');
const stationList = ['Karlsruhe Hbf', 'K\u00f6ln Hbf', 'Hamburg Hbf'];
assert('dirty with button labels', cleanStationName('Pr\u00fcfen Angebote Abbrechen Karlsruhe Hbf', stationList), 'Karlsruhe Hbf');
assert('already clean', cleanStationName('K\u00f6ln Hbf', stationList), 'K\u00f6ln Hbf');
assert('no match falls back', cleanStationName('Unbekannt', stationList), 'Unbekannt');
assert('null input', cleanStationName(null, stationList), null);
assert('empty list', cleanStationName('K\u00f6ln Hbf', []), 'K\u00f6ln Hbf');

// --- getDisplayDirection ---
group('getDisplayDirection()');
assert('first wagon is front, low number -> left',
  getDisplayDirection({ firstWagonIsFront: true, direction: 'left' }, ['1', '2', '3', '14']),
  'left');
assert('first wagon NOT front, high number at end -> right',
  getDisplayDirection({ firstWagonIsFront: false, direction: 'left' }, ['1', '2', '3', '14']),
  'right');
assert('fallback on empty wagons',
  getDisplayDirection({ direction: 'left' }, []),
  'left');
assert('single wagon fallback',
  getDisplayDirection({ direction: 'right' }, ['5']),
  'right');
// ICE 549 wagon order: 37,36,35,34,33,32,31 - first wagon is front (pfeillinks)
// frontWagon = wagonNumbers[0] = "37", which is > midpoint (34) -> right
assert('ICE 549 real wagons: first is front, high number',
  getDisplayDirection({ firstWagonIsFront: true, direction: 'left' }, ['37', '36', '35', '34', '33', '32', '31']),
  'right');

// --- filterRelevantSegments ---
group('filterRelevantSegments()');
const segs4 = [{id:0},{id:1},{id:2},{id:3}];
assert('both indices valid', filterRelevantSegments(segs4, 1, 2),
  { segments: [{id:1},{id:2}], startIdx: 1 });
assert('reversed indices', filterRelevantSegments(segs4, 2, 1),
  { segments: [{id:1},{id:2}], startIdx: 1 });
assert('from=-1 returns all', filterRelevantSegments(segs4, -1, 2),
  { segments: segs4, startIdx: 0 });
assert('both=-1 returns all', filterRelevantSegments(segs4, -1, -1),
  { segments: segs4, startIdx: 0 });

// --- formatDuration ---
group('formatDuration()');
assert('hours and minutes', formatDuration({ hours: 2, minutes: 6 }), '2h06min');
assert('minutes only', formatDuration({ hours: 0, minutes: 45 }), '45min');
assert('null', formatDuration(null), '');
assert('zero minutes', formatDuration({ hours: 1, minutes: 0 }), '1h00min');

// --- parseValidity ---
group('parseValidity()');
const v1 = parseValidity('Reihung g\u00fcltig <abbr title="t\u00e4glich">tgl</abbr> <time datetime="2026-02-07">07.02.2026</time> bis <time datetime="2026-06-13">13.06.2026</time>\t\t\t<span class="reihungsverzeichnis-eintrag-zug-link">\n\t\t\t\t<a href="?zug_id=20260100549">ansehen</a>\n\t\t\t</span>');
assert('two dates: from', v1.from, '2026-02-07');
assert('two dates: to', v1.to, '2026-06-13');
assert('two dates: text', v1.text, 'Reihung g\u00fcltig tgl 07.02.2026 bis 13.06.2026');

const v2 = parseValidity('Reihung g\u00fcltig <abbr title="Montag">Mo</abbr> bis <time datetime="2026-06-08">08.06.2026</time>\t\t\t<span class="reihungsverzeichnis-eintrag-zug-link"><a href="?zug_id=20260100378">ansehen</a></span>');
assert('"bis" single date: from is null', v2.from, null);
assert('"bis" single date: to is set', v2.to, '2026-06-08');

const v3 = parseValidity('Reihung g\u00fcltig <abbr title="t\u00e4glich">tgl</abbr> ab <time datetime="2026-10-02">02.10.2026</time>\t\t\t<span class="reihungsverzeichnis-eintrag-zug-link"><a href="?zug_id=20260300549">ansehen</a></span>');
assert('"ab" single date: from is set', v3.from, '2026-10-02');
assert('"ab" single date: to is null', v3.to, null);

// Day-of-week parsing
assert('tgl = all days', v1.days, null);
assert('"bis" Mo = Monday only', v2.days, [1]);
assert('"ab" tgl = all days', v3.days, null);

const v4 = parseValidity('Reihung g\u00fcltig <abbr title="Montag bis Samstag">Mo-Sa</abbr> bis <time datetime="2026-06-13">13.06.2026</time><span class="reihungsverzeichnis-eintrag-zug-link"><a href="?zug_id=1">ansehen</a></span>');
assert('Mo-Sa range', v4.days, [1, 2, 3, 4, 5, 6]);

const v5 = parseValidity('Reihung g\u00fcltig <abbr title="Dienstag">Di</abbr>, <abbr title="Mittwoch">Mi</abbr>, <abbr title="Donnerstag">Do</abbr>, <abbr title="Freitag">Fr</abbr>, <abbr title="Samstag">Sa</abbr>, <abbr title="Sonntag">So</abbr> ab <time datetime="2026-10-02">02.10.2026</time><span class="reihungsverzeichnis-eintrag-zug-link"><a href="?zug_id=1">ansehen</a></span>');
assert('Di-So comma list', v5.days, [2, 3, 4, 5, 6, 0]);

// --- findValidEntry ---
group('findValidEntry()');
const entries = [
  { name: 'A', validity: { from: null, to: '2026-06-08' } },
  { name: 'B', validity: { from: '2026-06-15', to: '2026-09-28' } },
  { name: 'C', validity: { from: '2026-10-05', to: null } }
];
assert('date in "bis" range', findValidEntry(entries, '2026-05-01')?.name, 'A');
assert('date in from-to range', findValidEntry(entries, '2026-08-15')?.name, 'B');
assert('date in "ab" range', findValidEntry(entries, '2026-10-31')?.name, 'C');
assert('boundary: exactly on to', findValidEntry(entries, '2026-06-08')?.name, 'A');
assert('boundary: exactly on from', findValidEntry(entries, '2026-06-15')?.name, 'B');
assert('no match (gap)', findValidEntry(entries, '2026-06-10'), null);
// Entry with no dates = always valid
const entriesNoDate = [{ name: 'X', validity: { from: null, to: null } }];
assert('no dates = always valid', findValidEntry(entriesNoDate, '2026-10-31')?.name, 'X');

// Day-of-week matching (ICE 378 scenario)
const entriesDow = [
  { name: 'Mo', validity: { from: '2026-10-05', to: null, days: [1] } },
  { name: 'Di-So', validity: { from: '2026-10-02', to: null, days: [2, 3, 4, 5, 6, 0] } }
];
// 2026-10-05 = Monday
assert('Mon Oct 5 matches Mo entry', findValidEntry(entriesDow, '2026-10-05')?.name, 'Mo');
// 2026-10-06 = Tuesday
assert('Tue Oct 6 matches Di-So entry', findValidEntry(entriesDow, '2026-10-06')?.name, 'Di-So');
// 2026-10-11 = Sunday
assert('Sun Oct 11 matches Di-So entry', findValidEntry(entriesDow, '2026-10-11')?.name, 'Di-So');
// 2026-10-12 = Monday
assert('Mon Oct 12 matches Mo entry', findValidEntry(entriesDow, '2026-10-12')?.name, 'Mo');
// 2026-10-03 = Saturday, before Mo entry starts but after Di-So starts
assert('Sat Oct 3 matches Di-So entry', findValidEntry(entriesDow, '2026-10-03')?.name, 'Di-So');

// --- parseRichtungswechsel ---
group('parseRichtungswechsel()');
const richHtml = '<img src="images/pfeillinks.svg" height="8" width="10" alt="Pfeil Links">&nbsp;K\u00f6ln Hbf \u2013 Berlin Ostbahnhof<br>';
const segs = parseRichtungswechsel(richHtml);
assert('single segment count', segs.length, 1);
assert('segment from', segs[0].from, 'K\u00f6ln Hbf');
assert('segment to', segs[0].to, 'Berlin Ostbahnhof');
assert('segment direction', segs[0].direction, 'left');
assert('firstWagonIsFront', segs[0].firstWagonIsFront, true);

const richHtml2 = '<img src="images/pfeillinks.svg" height="8" width="10" alt="Pfeil Links">&nbsp;Basel Bad Bf \u2013 Frankfurt(M)Hbf<br>Frankfurt(M)Hbf \u2013 Berlin Ostbahnhof <img src="images/pfeilrechts.svg" height="8" width="10" alt="Pfeil Rechts"><br>';
const segs2 = parseRichtungswechsel(richHtml2);
assert('two segments count', segs2.length, 2);
assert('seg1 direction left', segs2[0].direction, 'left');
assert('seg2 direction right', segs2[1].direction, 'right');

// Regression: station names containing a hyphen (Berlin-Gesundbrunnen, München-Pasing)
// must NOT be split at the internal hyphen — only at the spaced separator " – ".
const richHyphen = '<img src="images/pfeillinks.svg">&nbsp;Berlin-Gesundbrunnen – Leipzig Hbf<br>';
const segsHy = parseRichtungswechsel(richHyphen);
assert('hyphen seg count', segsHy.length, 1);
assert('hyphen seg from (name kept intact)', segsHy[0].from, 'Berlin-Gesundbrunnen');
assert('hyphen seg to', segsHy[0].to, 'Leipzig Hbf');
const richHyphen2 = '<img src="images/pfeilrechts.svg">&nbsp;Stuttgart Hbf – München-Pasing<br>';
const segsHy2 = parseRichtungswechsel(richHyphen2);
assert('hyphen2 seg from', segsHy2[0].from, 'Stuttgart Hbf');
assert('hyphen2 seg to (trailing hyphen name kept)', segsHy2[0].to, 'München-Pasing');

// --- bahn.de Abfahrtstafel (reiseloesung/abfahrten) ---
group('parseBahnDeBoard()');
const boardFixture = { entries: [
  { bahnhofsId: '8098160', zeit: '2026-09-12T08:31:00', gleis: '5', journeyId: '2|#VN#1#ZI#1#', verkehrmittel: { name: 'ICE 371', kurzText: 'ICE', produktGattung: 'ICE' } },
  { bahnhofsId: '8098160', zeit: '2026-09-12T08:36:00', gleis: '4', journeyId: '2|#VN#1#ZI#2#', verkehrmittel: { name: 'ICE 1005', kurzText: 'ICE' } },
  { bahnhofsId: '8098160', zeit: '2026-09-12T08:34:00', journeyId: '2|#VN#1#ZI#3#', verkehrmittel: { mittelText: 'RJ  870' } },
  { bahnhofsId: '8098160', zeit: '2026-09-12T08:40:00', verkehrmittel: { name: 'ICE 9999' } },
  { bahnhofsId: '8098160', zeit: '2026-09-12T08:41:00', journeyId: '2|#VN#1#ZI#5#' },
] };
const board = parseBahnDeBoard(boardFixture.entries);
assert('board: entries without journeyId or name are dropped', board.length, 3);
assert('board: name taken from verkehrmittel.name', board[1].name, 'ICE 1005');
assert('board: falls back to mittelText and collapses whitespace', board[2].name, 'RJ 870');
assert('board: keeps zeit and journeyId', [board[1].zeit, board[1].journeyId], ['2026-09-12T08:36:00', '2|#VN#1#ZI#2#']);
assert('board: non-array -> []', parseBahnDeBoard(null), []);

group('pickBoardEntry()');
const twoRuns = [
  { name: 'ICE 1005', zeit: '2026-09-12T07:36:00', journeyId: 'early' },
  { name: 'ICE 1005', zeit: '2026-09-12T08:36:00', journeyId: 'exact' },
];
assert('prefers the entry at the exact minute', pickBoardEntry(twoRuns, 'ICE 1005', '2026-09-12T08:36'), 'exact');
assert('falls back to first name match when minute differs', pickBoardEntry(twoRuns, 'ICE 1005', '2026-09-12T08:37'), 'early');
assert('returns null when the train is not on the board', pickBoardEntry(twoRuns, 'ICE 1006', '2026-09-12T08:36'), null);
assert('same number, other long-distance type (IC vs ICE) is accepted as fallback', pickBoardEntry([{ name: 'IC 1005', zeit: '2026-09-12T08:36:00', journeyId: 'ic' }], 'ICE 1005', '2026-09-12T08:36'), 'ic');
assert('exact name beats same-number-other-type even at the wanted minute', pickBoardEntry([{ name: 'IC 1005', zeit: '2026-09-12T08:36:00', journeyId: 'ic' }, { name: 'ICE 1005', zeit: '2026-09-12T09:36:00', journeyId: 'ice' }], 'ICE 1005', '2026-09-12T08:36'), 'ice');
assert('RJX 251 matches RJ 251', boardEntryMatches('RJX 251', 'RJ 251'), true);
assert('a bus/S-Bahn with the same number never matches', [boardEntryMatches('S 1005', 'ICE 1005'), boardEntryMatches('Bus 1005', 'ICE 1005'), boardEntryMatches('RE 1005', 'ICE 1005')], [false, false, false]);
assert('different number never matches', boardEntryMatches('ICE 1006', 'ICE 1005'), false);

// --- bahn.de Zuglauf (reiseloesung/fahrt) ---
group('parseBahnDeHalte()');
const fahrtFixture = { zugName: 'ICE 1005', halte: [
  { name: 'Berlin Gesundbrunnen', extId: '8011102', abfahrt: { sollzeit: '2026-09-12T08:26:00' } },
  { name: 'Berlin Hbf', extId: '8098160', ankunft: { sollzeit: '2026-09-12T08:32:00' }, abfahrt: { sollzeit: '2026-09-12T08:36:00' } },
  { name: '  Halle(Saale)Hbf ', extId: '8010159', ankunft: { sollzeit: '2026-09-12T09:43:00' }, abfahrt: { sollzeit: '2026-09-12T09:45:00' } },
  { extId: '0000000' },
  { name: 'München Hbf', extId: '8000261', ankunft: { sollzeit: '2026-09-12T12:46:00' } },
] };
const halte = parseBahnDeHalte(fahrtFixture.halte);
assert('halte: nameless stops dropped', halte.length, 4);
assert('halte: first stop dep only', [halte[0].name, halte[0].dep, halte[0].arr], ['Berlin Gesundbrunnen', '2026-09-12T08:26:00', null]);
assert('halte: middle stop arr + dep', [halte[1].arr, halte[1].dep], ['2026-09-12T08:32:00', '2026-09-12T08:36:00']);
assert('halte: names trimmed', halte[2].name, 'Halle(Saale)Hbf');
assert('halte: last stop arr only', [halte[3].arr, halte[3].dep], ['2026-09-12T12:46:00', null]);
assert('halte: non-array -> []', parseBahnDeHalte(undefined), []);
const geoHalte = parseBahnDeHalte([{ name: 'Berlin Hbf', id: 'A=1@O=Berlin Hbf@X=13369549@Y=52525589@U=80@L=8098160@', abfahrt: { sollzeit: '2026-09-12T08:36:00' } }, { name: 'X' }]);
assert('halte: coordinates parsed from the HAFAS id', [geoHalte[0].lon, geoHalte[0].lat], [13.369549, 52.525589]);
assert('halte: no id -> no coordinates', [geoHalte[1].lon, geoHalte[1].lat], [undefined, undefined]);
// Die Zeiten von bahn.de sind lokale Zeit ohne Zone — computeSegmentDuration muss
// daraus dieselbe Dauer bilden wie frueher aus den UTC-Zeiten von bahn.expert.
assert('durations from bahn.de local times', computeSegmentDuration('Berlin Hbf', 'München Hbf', halte), { hours: 4, minutes: 10 });

group('shiftTime()');
assert('minus 2 min', shiftTime('08:36', -2), '08:34:00');
assert('minus 45 min across the hour', shiftTime('08:36', -45), '07:51:00');
assert('clamps at midnight', shiftTime('00:10', -45), '00:00:00');
assert('clamps at end of day', shiftTime('23:50', 30), '23:59:00');

// --- stationOrderMatchesEntry (wrong-train guard) ---
// Historisch lieferte bahn.expert bei der Suche nach NUMMER manchmal einen anderen
// Zug gleicher Nummer ("ICE 20" Wien–München vs. Milano–Zürich). bahn.de matcht
// den exakten Namen, der Schutz bleibt trotzdem: eine Liste ohne Ueberlappung mit
// Route/Segmenten von fernbahn.de wird verworfen (Fallback auf fernbahn.de).
group('stationOrderMatchesEntry()');
const ice20Entry = {
  route: 'Wien Hbf — München Hbf',
  segments: [
    { from: 'Wien Hbf', to: 'Regensburg Hbf' },
    { from: 'Regensburg Hbf', to: 'München Hbf' }
  ]
};
// A wrong train sharing the number (Milano – Zürich):
const wrongTrainStops = ['Milano Centrale', 'Como S. Giovanni', 'Chiasso', 'Lugano',
  'Bellinzona', 'Arth-Goldau', 'Zug (CH)', 'Zürich HB'].map(name => ({ name }));
assert('rejects a station list from a different train sharing the number',
  stationOrderMatchesEntry(wrongTrainStops, ice20Entry), false);
// The correct fernbahn.de fallback order for ICE 20:
const rightTrainStops = ['Wien', 'Linz', 'Passau', 'Regensburg', 'München'].map(name => ({ name }));
assert('accepts the correct station list (matches route/segments)',
  stationOrderMatchesEntry(rightTrainStops, ice20Entry), true);
assert('accepts when only one anchor overlaps',
  stationOrderMatchesEntry([{ name: 'Regensburg Hbf' }, { name: 'Somewhere Else' }], ice20Entry), true);
assert('rejects an empty station list',
  stationOrderMatchesEntry([], ice20Entry), false);
assert('accepts any list when the entry has no anchors to check against',
  stationOrderMatchesEntry([{ name: 'Anywhere' }], { route: '', segments: [] }), true);

// --- findSegmentForStation (reroute clamp) ---
// Today's actual route can extend beyond the stretch fernbahn.de covers:
// a rerouted ICE 691 starts in Hamburg while the fernbahn.de wagon-order
// diagram begins at Berlin-Gesundbrunnen (which today's train doesn't even
// serve). Stations outside the covered range must clamp to the outermost
// segment instead of mapping to no segment at all.
group('findSegmentForStation()');
const ice691Segments = [
  { from: 'Berlin-Gesundbrunnen', to: 'Leipzig Hbf' },
  { from: 'Leipzig Hbf', to: 'Frankfurt(M)Hbf' },
  { from: 'Frankfurt(M)Hbf', to: 'Stuttgart Hbf' },
  { from: 'Stuttgart Hbf', to: 'München Hbf' }
];
const ice691Reroute = ['Hamburg Hbf', 'Büchen', 'Ludwigslust', 'Wittenberge',
  'Berlin Hbf', 'Berlin Südkreuz', 'Lutherstadt Wittenberg Hbf', 'Leipzig Hbf',
  'Erfurt Hbf', 'Frankfurt (Main) Hbf', 'Mannheim Hbf', 'Stuttgart Hbf',
  'Ulm Hbf', 'München Hbf'].map(name => ({ name }));
assert('station inside a covered segment maps normally',
  findSegmentForStation(ice691Segments, 'Erfurt Hbf', ice691Reroute), 1);
assert('station before the covered range clamps to the first segment',
  findSegmentForStation(ice691Segments, 'Büchen', ice691Reroute), 0);
assert('very first station of the extended route clamps to the first segment',
  findSegmentForStation(ice691Segments, 'Hamburg Hbf', ice691Reroute), 0);
assert('last station still maps to the last segment',
  findSegmentForStation(ice691Segments, 'München Hbf', ice691Reroute), 3);
assert('station not on the route at all maps to no segment',
  findSegmentForStation(ice691Segments, 'Köln Hbf', ice691Reroute), -1);
// Route extended beyond the covered range at the END (mirror case):
const shortSegments = [{ from: 'Berlin Hbf', to: 'Leipzig Hbf' }];
const extendedStops = ['Berlin Hbf', 'Leipzig Hbf', 'Nürnberg Hbf'].map(name => ({ name }));
assert('station after the covered range clamps to the last segment',
  findSegmentForStation(shortSegments, 'Nürnberg Hbf', extendedStops), 0);

// --- computeSegmentDuration ---
group('computeSegmentDuration()');
const stationOrder = [
  { name: 'Karlsruhe Hbf', dep: '2026-02-19T10:00:00.000Z', arr: null },
  { name: 'Mannheim Hbf', dep: '2026-02-19T10:30:00.000Z', arr: '2026-02-19T10:28:00.000Z' },
  { name: 'Frankfurt(M)Hbf', dep: '2026-02-19T11:15:00.000Z', arr: '2026-02-19T11:12:00.000Z' },
  { name: 'K\u00f6ln Hbf', dep: null, arr: '2026-02-19T12:06:00.000Z' }
];
assert('Karlsruhe to K\u00f6ln',
  computeSegmentDuration('Karlsruhe Hbf', 'K\u00f6ln Hbf', stationOrder),
  { hours: 2, minutes: 6 });
assert('Mannheim to Frankfurt',
  computeSegmentDuration('Mannheim Hbf', 'Frankfurt(M)Hbf', stationOrder),
  { hours: 0, minutes: 42 });
assert('missing station returns null',
  computeSegmentDuration('Berlin Hbf', 'Hamburg Hbf', stationOrder),
  null);
assert('empty stationOrder returns null',
  computeSegmentDuration('Karlsruhe Hbf', 'K\u00f6ln Hbf', []),
  null);

// Fallback: segment boundary not in list -> fall back to list edges
assert('unknown from falls back to first station',
  computeSegmentDuration('Basel Bad Bf', 'K\u00f6ln Hbf', stationOrder),
  { hours: 2, minutes: 6 });

// Duration with adjusted segment boundaries (the bug fix)
assert('sub-segment: Mannheim to K\u00f6ln',
  computeSegmentDuration('Mannheim Hbf', 'K\u00f6ln Hbf', stationOrder),
  { hours: 1, minutes: 36 });

// ---- Summary ----
const summary = document.createElement('div');
summary.className = `summary ${failed === 0 ? 'all-pass' : 'has-fail'}`;
summary.textContent = `${passed + failed} tests: ${passed} passed, ${failed} failed`;
results.appendChild(summary);
</script>
